[package]
name = "haxo001"
version = "0.1.0"
authors = ["Javier Cardona <javier.cardona@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
alsa = "0.11.0"
env_logger = "0.11.11"
log = "0.4.14"
midir = "0.11.0"
rand = "0.10.2"
rppal = { version = "0.22.1", features = ["hal"] }
serde_json = "1.0"
schedule_recv = "0.1"
static_assertions = "1.1.0"
structopt = "0.3.22"
time = "0.3.55"
fluidlite = { version = "0.2.1", features = ["builtin"] }

[dev-dependencies]
test-log = "0.2.12"

[build-dependencies]
vergen = { version = "8.2.6", features = ["git", "gitcl"] }

[features]
default = []
# Enable timing measurements via GPIO (UART_RXD).  Cannot be enabled when serial
# console is used.
instrumentation = []
midi = []
